name: SkillBOX - Acquire Skill

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  acquire:
    # 내 계정이 만든 Issue만 실행
    if: github.event.issue.user.login == github.repository_owner

    runs-on: ubuntu-latest

    steps:
      # 1. SkillBOX 저장소 가져오기
      - name: Checkout SkillBOX
        uses: actions/checkout@v4

      # 2. Issue 본문에서 GitHub 주소 찾기
      - name: Read Issue
        id: issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          REPO_URL=$(echo "$ISSUE_BODY" | grep -oE 'https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' | head -n 1)

          if [ -z "$REPO_URL" ]; then
            echo "GitHub Repository URL을 찾지 못했습니다."
            exit 1
          fi

          SKILL_NAME=$(basename "$REPO_URL" .git)

          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "skill_name=$SKILL_NAME" >> "$GITHUB_OUTPUT"

          echo "Repository: $REPO_URL"
          echo "Skill Name: $SKILL_NAME"

      # 3. 원본 Repository 다운로드
      - name: Download Skill
        env:
          REPO_URL: ${{ steps.issue.outputs.repo_url }}
        run: |
          git clone --depth 1 "$REPO_URL" /tmp/skill

      # 4. SkillBOX의 skills 폴더에 복사
      - name: Install Skill
        env:
          SKILL_NAME: ${{ steps.issue.outputs.skill_name }}
        run: |
          mkdir -p skills

          rm -rf "skills/$SKILL_NAME"

          cp -a /tmp/skill "skills/$SKILL_NAME"

          rm -rf "skills/$SKILL_NAME/.git"

      # 5. 변경사항 자동 Commit
      - name: Commit Skill
        env:
          SKILL_NAME: ${{ steps.issue.outputs.skill_name }}
        run: |
          git config user.name "SkillBOX Bot"
          git config user.email "skillbox-bot@users.noreply.github.com"

          git add "skills/$SKILL_NAME"

          git commit -m "Acquire skill: $SKILL_NAME"

          git push
